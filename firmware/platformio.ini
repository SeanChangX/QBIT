; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-supermini]
; pioarduino platform provides Arduino ESP32 Core v3.x
; required by NetWizard (https://docs.netwizard.pro/docs/intro/installation)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
; ESP32-S3 SuperMini: generic S3 target. Most clones are ESP32-S3R2 (4MB flash,
; 2MB PSRAM); flash size is pinned to 4MB to match partitions.csv. PSRAM is left
; disabled so N4 (no-PSRAM) variants also boot.
board = esp32-s3-devkitc-1
framework = arduino
; Native USB-C on GPIO19/20: route Serial to the USB CDC port so the monitor
; and auto-detect work without a separate UART bridge.
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
build_flags =
    -Iinclude
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DNETWIZARD_USE_ASYNC_WEBSERVER=1
    -DCORE_DEBUG_LEVEL=0
    -DQBIT_VERSION=\"${sysenv.QBIT_VERSION}\"
    ; WebSocket backend — defaults in main.cpp: ws://localhost:3001/device
    ; Override via build flags for production or local testing:
    ; -DWS_HOST=\"YOUR_DEV_SERVER\"
    ; -DWS_PORT=5173
    ; -DWS_API_KEY=\"dev-test-key\"
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
lib_compat_mode = strict
lib_ldf_mode = deep
extra_scripts = pre:scripts/patch_arduinowebsockets.py
; Pin to the native USB CDC node (glob) so auto-detect never grabs Bluetooth-Incoming-Port.
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
lib_deps =
    olikraus/U8g2@=2.36.18
    ayushsharma82/NetWizard@=1.2.2
    ESP32Async/ESPAsyncWebServer@=3.10.0
    ESP32Async/AsyncTCP@=3.4.10
    bblanchon/ArduinoJson@=7.4.3
    end2endzone/NonBlockingRTTTL@=1.4.0
    gilmaimon/ArduinoWebsockets@=0.5.4
    knolleary/PubSubClient@=2.8
    ricmoo/QRCode@=0.0.1
monitor_speed = 115200
