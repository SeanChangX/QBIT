name: CI

# Runs only the jobs for the parts of the repo a change touches. The final `ci`
# job is the single required status check: jobs skipped by the path filter
# count as passing, so a firmware-only PR is not held up by web checks.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      admin: ${{ steps.filter.outputs.admin }}
      firmware: ${{ steps.filter.outputs.firmware }}
      tools: ${{ steps.filter.outputs.tools }}
    steps:
      - uses: actions/checkout@v7
      # Third-party action: pinned to a commit SHA (Dependabot keeps it current)
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # A change to this workflow re-runs every job
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
            workflows:
              - .github/workflows/**
              - .github/actionlint.yaml
            backend:
              - *ci
              - web/backend/**
            frontend:
              - *ci
              - web/frontend/**
            admin:
              - *ci
              - web/admin/**
            firmware:
              - *ci
              - firmware/**
            tools:
              - *ci
              - tools/qbit-ctl
              - tools/tests/**
              # the tests run every console query against this schema
              - web/backend/src/db.ts

  workflows:
    name: Workflows (actionlint)
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Checks syntax, expressions, action inputs (incl. after Dependabot
      # bumps) and runs shellcheck on every `run:` script
      # Pinned version, not :latest, so new rules never fail CI unannounced.
      # Dependabot does not see images inside `run:`; bump this by hand.
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  backend:
    name: Backend (typecheck, lint, test)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  frontend:
    name: Frontend (build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  admin:
    name: Admin UI (build)
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - run: npm ci
      - run: npm run build

  firmware:
    name: Firmware (build)
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            firmware/.pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - run: pip install platformio==6.2.0
      # No secrets on PR builds: the firmware falls back to its default WS_HOST / key
      - run: pio run -e seeed_xiao_esp32c3
      - run: pio run -e seeed_xiao_esp32c3 -t buildfs

  tools:
    name: Tools (qbit-ctl)
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Oldest Python qbit-ctl supports: Ubuntu 22.04 servers ship 3.10
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tools/tests -v
      - run: tools/qbit-ctl --help

  ci:
    name: ci
    needs: [changes, workflows, backend, frontend, admin, firmware, tools]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            echo "::error::A CI job failed or was cancelled"
            exit 1
          fi
